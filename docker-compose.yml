version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexaerp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexaerp
      POSTGRES_PASSWORD: nexaerp_secret
      POSTGRES_DB: nexaerp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexaerp -d nexaerp_db']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexaerp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexaerp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: